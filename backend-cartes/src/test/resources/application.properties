# Base H2 en mémoire pour les tests (isolation totale)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT identique à l'appli (obligatoire pour les tests qui génèrent des tokens)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Désactiver le BotInitializer dans les tests pour éviter les conflits
spring.autoconfigure.exclude=

# Logging minimal
logging.level.root=WARN
logging.level.fr.enseeiht=INFO
