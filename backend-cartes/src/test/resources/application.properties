# Base H2 en mémoire pour les tests (isolation totale)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Secret distinct, réservé aux tests et remplaçable par variable d'environnement
jwt.secret=${JWT_TEST_SECRET:local-test-only-key-not-for-production-use-0123456789abcdef}
jwt.expiration=86400000

# Désactiver le BotInitializer dans les tests pour éviter les conflits
spring.autoconfigure.exclude=

# Logging minimal
logging.level.root=WARN
logging.level.fr.enseeiht=INFO
