spring.application.name=backend-cartes

# H2 Database (fichier persistant)
spring.datasource.url=jdbc:h2:file:./data/cartesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (dev uniquement)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080
server.address=0.0.0.0

# Logging — bot debug
logging.level.fr.enseeiht.jeux.service.BotService=DEBUG
logging.level.fr.enseeiht.jeux.service.JeuService=DEBUG

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000