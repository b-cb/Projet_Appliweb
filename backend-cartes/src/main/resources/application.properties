spring.application.name=backend-cartes
spring.main.allow-circular-references=true

# H2 Database (fichier persistant local)
spring.datasource.url=jdbc:h2:file:./data/cartesdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (désactivée par défaut, développement local uniquement)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Server (écoute locale par défaut)
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}

# Origines de développement autorisées (liste séparée par des virgules)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging — bot debug
logging.level.fr.enseeiht.jeux.service.BotService=DEBUG
logging.level.fr.enseeiht.jeux.service.JeuService=DEBUG

# JWT — obligatoire hors tests; start.sh en génère un temporaire si absent
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
